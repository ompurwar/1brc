[package]
name = "row1bChellange"
version = "0.1.0"
edition = "2024"

[dependencies]
memmap2 = "0.9.5"
rayon = "1.8"
hashbrown = "0.15"
rustc-hash = "2.1.1"
fast-float = "0.2.0"
rand = "0.8.0"
crossbeam = "0.8.4"
num_cpus = "1.16.0"
memchr = "2.7.4"
clap = { version = "4.0", features = ["derive"] }
gxhash = "3.4"

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
